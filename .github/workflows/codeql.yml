name: "CodeQL"
on: # yamllint disable-line rule:truthy
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@2bd348c5c236a10db670232e5b08619ccbaf55b3" # v21.0.5
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\"]"
